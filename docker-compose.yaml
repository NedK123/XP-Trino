version: '3.8'

services:
  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: superset_db
      MYSQL_USER: superset
      MYSQL_PASSWORD: superset_password
    ports:
      - "3306:3306"
    networks:
      - superset-network
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - superset-network
    volumes:
      - mongo_data:/data/db

  trino:
    image: trinodb/trino:468
    environment:
      - TRINO_JVM_HEAP=1G
    ports:
      - "8080:8090"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  superset:
    image: apache/superset:latest
    container_name: superset
    environment:
      - SUPERSET_SECRET_KEY=your_secret_key
      - SUPERSET_DATABASE_URL=postgresql://superset:superset_password@postgres:5432/superset_db
    ports:
      - "8088:8088"
    depends_on:
      - trino
      - postgres
      - mongo
    networks:
      - superset-network
    volumes:
      - superset_home:/app/superset_home

networks:
  superset-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  mysql_data:
  superset_home:
