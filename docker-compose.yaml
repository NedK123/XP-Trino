version: '3.8'

services:
  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: superset_db
      MYSQL_USER: superset
      MYSQL_PASSWORD: superset_password
    ports:
      - "3306:3306"
    networks:
      - trino-network
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    networks:
      - trino-network

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - trino-network
    volumes:
      - mongo_data:/data/db

  trino:
    image: trinodb/trino:473
    container_name: trino
    ports:
      - "8080:8090"
    networks:
      - trino-network
    volumes:
      - $PWD/trino/catalogs:/etc/trino/catalog

networks:
  trino-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  mysql_data:
  trino:
