version: '3.8'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"

  postgres:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"

  trino:
    image: trinodb/trino:latest
    environment:
      - TRINO_JVM_HEAP=1G
    ports:
      - "8080:8090"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
